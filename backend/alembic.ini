# Alembic Configuration File
# Bu dosya Alembic migration aracının konfigürasyonunu içerir.

[alembic]
# Migration script'lerinin bulunduğu dizin
script_location = alembic

# Template dosyası — yeni migration oluştururken kullanılır
# file_template = %%(rev)s_%%(slug)s

# Timezone ayarı
# timezone =

# SQLAlchemy URL — env.py'den override edilecek (.env dosyasından)
sqlalchemy.url = driver://user:pass@localhost/dbname
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
