        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1A2332 0%, #0F1419 100%);
            min-height: 100vh;

        .login-card {

            position: fixed;
            bottom: 0;

<body class="flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden">
<!-- Top Navigation (Suppressed/Hidden per Task Focus Logic for Login) -->
<main class="relative z-10 w-full flex items-center justify-center">
<div class="login-card w-full max-w-[420px] rounded-xl p-xl flex flex-col gap-xl">
<!-- Header section -->
<header class="flex flex-col items-center text-center gap-md">
<div class="mb-sm">
<img alt="EduRAG Logo" class="h-24 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFxbUcik6pC75GVCqs_3F8ZkkcUG9zSp-8BLAmkaEUndGJNu-12srfK7bUZ4jCxCzvX1-3eNVB8fHGsLM16Zl1NUOoiOR-fgHjsH1dFXPzq1E95ghIZYkI5QG3V1tVwMa1nLSqdw-hb57AenZD6B7HTG1TdzI3btdHM4NuFlb05qbx-NK8YgXgjUeyXmNuxLqPJc_3ALetDuo5vQlj2BqqyWl3JXkJOrhM5Np1Z9fQxM_vlWjTCcXu63Dib2y3ntM9vFNbCJ-7_hE"/>

<div class="space-y-xs">
<h1 class="font-headline-md text-headline-md text-on-primary">Sign In</h1>
<p class="font-body-md text-body-md text-outline-variant">Special Education AI Assistant</p>
</div>
</header>
<!-- Form section -->
<form class="flex flex-col gap-lg" onsubmit="return false;">
<div class="space-y-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-primary ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-[#2D3748] border-none text-on-primary rounded-lg focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline-variant" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-primary ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-[#2D3748] border-none text-on-primary rounded-lg focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-end">
<a class="font-label-sm text-label-sm text-accent-amber hover:opacity-80 transition-opacity mt-xs" href="#">Forgot password?</a>
</div>
</div>
</div>
<button class="w-full h-[48px] bg-primary-container text-on-primary font-label-md text-label-md rounded-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-lg flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<footer class="text-center pt-md">
<p class="font-body-md text-body-md text-outline-variant">
                    Don't have an account? 
                    <a class="text-accent-amber font-semibold hover:underline transition-all" href="#">Register</a>
</p>
</footer>
</div>
</main>
<!-- Decorative Background Elements -->
<div class="decorative-wave"></div>
<div class="fixed top-20 right-[-100px] w-64 h-64 rounded-full bg-primary/10 blur-[100px] pointer-events-none"></div>
<div class="fixed bottom-20 left-[-100px] w-80 h-80 rounded-full bg-accent-amber/5 blur-[120px] pointer-events-none"></div>
